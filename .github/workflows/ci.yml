name: CI

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile all Python sources
        run: python -m compileall -q ingest.py server.py db_export.py library.py
      - name: Codex and Claude Code skill copies match
        run: diff -r .claude/skills .agents/skills
